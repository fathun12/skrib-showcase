<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F11" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Offline | Skrib</title>
<style>
  :root { --bg: #FAFAF8; --fg: #1A1A1A; --muted: #6B6B66; --accent: #4F46E5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F0F11; --fg: #F5F5F2; --muted: #A1A1A8; --accent: #6366F1; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 360px; }
  .logo {
    margin: 0; font-family: Georgia, "Times New Roman", serif;
    font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1;
  }
  .logo span { color: var(--accent); }
  h1 { margin: 32px 0 8px; font-size: 20px; }
  p { margin: 0; color: var(--muted); line-height: 1.6; }
  button {
    margin-top: 24px; padding: 12px 22px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="logo">Skrib<span>.</span></p>
  <h1>You're offline</h1>
  <p>Check your connection. This page reloads by itself when you're back online.</p>
  <a href="/me/saved" style="display:inline-block;margin-top:24px;padding:12px 22px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none">Saved stories</a>
  <br>
  <button type="button" id="retry" style="margin-top:12px;background:transparent;color:var(--accent);border:1px solid var(--accent)">Try again</button>
</main>
<script>
  document.getElementById("retry").addEventListener("click", function () {
    location.reload();
  });
  window.addEventListener("online", function () {
    location.reload();
  });
</script>
</body>
</html>
